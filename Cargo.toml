[workspace.package]
version = "0.1.0"
authors = ["Elmar Schug <elmar.schug@jayware.org>"]
repository = "https://github.com/kKdH/spacenav-rs"
keywords = []
categories = []
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"

[workspace]
resolver = "3"
members = [
    "libspnav",
    "spacenav-cockpit",
    "spacenav-cockpit/spacenav-settings",
]

[workspace.dependencies]
libspnav = { path = "libspnav" }
spacenav-cockpit = { path = "spacenav-cockpit" }
spacenav-settings = { path = "spacenav-cockpit/spacenav-settings" }
spacenav-client = { path = "spacenav-cockpit/spacenav-client" }

directories = { version = "6.0.*"}
futures = { version = "0.3.*" }
googletest = { version = "0.14.*" }
iced = { version = "0.14.*", features = ["debug"] }
iced_aw = { version = "0.13.*" }
iced_font_awesome = { version = "0.4.*" }
iced_toaster = { version = "0.2.0" }
image = { version = "0.25.*" }
num-traits = { version = "0.2.19" }
serde = { version = "1.*" }
shadow-rs = { version = "1.7.*", default-features = false }
tokio = { version = "*" }
tokio-stream = { version = "0.1.*" }
toml = { version = "1.0.4+spec-1.1.0" }
tracing = { version = "0.1.*" }
tracing-subscriber = { version = "0.3.*" }
indoc = { version = "2.0.*" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
